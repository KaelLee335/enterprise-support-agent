          \ {\"route\": \"direct\", \"answer\": prefix + \"订单号：\" + order[\"order_id\"] + \"；商品：\" + order[\"product\"\
          ] + \"；数量：\" + str(order[\"quantity\"]) + \"；总金额：CNY \" + format(order[\"amount_cents\"] / 100, \".2f\"\
          ) + \"；状态：\" + order[\"status\"] + \"。固定快照：2026-11-10。此结果仅为只读模拟查询；退款状态不代表支付渠道实际到账。\"}\n    if re.search(r\"\
          DEMO|订单号|查.*订单|订单.*状态|我的订单|物流.*进度\", q, re.I):\n        return {\"route\": \"direct\", \"answer\": prefix\
          \ + \"请提供一个完整演示订单号，格式为 DEMO202611 加4位数字，例如 DEMO2026110001。\"}\n    return {\"route\": \"knowledge\", \"\
          answer\": \"\"}\n"
