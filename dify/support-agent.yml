    - data:
        title: 检索问法扩展
        type: code
        selected: false
        code_language: python3
        code: "\"\"\"Deterministically rewrite only the retrieval query; preserve sys.query for the answer.\"\"\"\
          \nimport re\n\n\ndef main(query: str) -> dict:\n    text = query.strip()\n    if re.search(r\"发票|开票|税号|专票\"\
          , text):\n        return {\"search_query\": (\n            f\"{text} 发票政策 POL-09 POL-10 \"\n         \
          \   \"知识库未规定开票时效、专票资格或开票金额调整规则，明确无法确认并请人工核验 \"\n            \"没有真实工单系统，不得声称已转接、已留言或已提交；发票抬头与税号不在演示聊天中收集\"\
          )}\n    has_refund_progress = bool(re.search(\n        r'(?:退款|退回).{0,16}(?:发起|到账|完成|进度|时间|银行)|(?:发起|到账|银行).{0,16}(?:退款|退回)',\
          \ text))\n    if has_refund_progress:\n        return {\"search_query\": (\n            f\"{text} 退款进度\
          \ POL-06 退货申请通过收货并检验 检验通过后1至3个工作日发起原支付渠道退款 \"\n            \"发起后通常1至5个工作日到账 两个阶段分别计时 不保证具体到账日 \"\n   \
          \         \"退款中表示流程尚未完成不等于资金已到账\")}\n    has_quality = bool(re.search(r\"质量|故障|换货|进水\", text))\n    has_shipping\
          \ = bool(re.search(r\"运费|寄回|邮费\", text))\n    has_return = bool(re.search(r\"无理由|7天|七天|拆封|退货\", text))\n\
          \    if has_quality and has_shipping:\n        return {\"search_query\": \"质量问题第1至第15个自然日可申请换货，需人工检测确认；经确认非人为质量问题退换货，标准寄回运费由企业承担\"\
          }\n    additions = []\n    if has_quality:\n        additions.append(\"质量换货检测 POL-03\")\n    if has_shipping:\n\
          \        additions.append(\"退换货运费 标准寄回运费 经人工确认的非人为质量问题 POL-05\")\n    if has_return:\n        additions.append(\"\
          无理由退货申请期限 POL-02\")\n    has_unknown_scope = bool(re.search(r\"未知|未覆盖|范围外|新型号|新机型|不在目录|没有列出\", text))\n\
          \    has_guarantee_or_timeline = bool(re.search(r\"保证|承诺|保證|多久|几天|天内|时效|维修时间|修好\", text))\n    if has_unknown_scope\
          \ and has_guarantee_or_timeline:\n        additions.extend((\n            \"本政策只适用于演示商城购买的全新办公键盘、鼠标、扩展坞；二手赠品和第三方商品不适用\"\
          ,\n            \"是否免费、维修方案和时间均需检测后确认，不能仅凭描述承诺\",\n            \"无法从知识库确认答案、政策冲突、订单不存在、物流异常或请求超出只读权限时，说明原因并建议联系人工；没有真实工单系统，不得声称已转接\"\
          ,\n        ))\n    elif re.search(r\"未来|新品|新款|上市\", text) and re.search(r\"价格|多少钱|上市|未来|新品\", text):\n\
          \        additions.append(\"演示商城服务范围 未知问题 人工协助 POL-01 POL-10\")\n    suffix = \" \".join(dict.fromkeys(additions))\n\
          \    return {\"search_query\": f\"{text} {suffix}\".strip()}\n"
        variables:
        - variable: query
          value_selector:
          - '1794315087381'
          - sys.query
        outputs:
          search_query:
            type: string
            children: null
