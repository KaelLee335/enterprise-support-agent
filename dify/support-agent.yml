    - data:
        title: 核对关键政策与未知拒答
        type: code
        selected: false
        code_language: python3
        code: "\"\"\"Validate citation and evidence sufficiency; preserve a cited natural-language draft only when\
          \ grounded.\"\"\"\nimport json\nimport re\nfrom datetime import date\n\nFALLBACK = ('【演示数据】现有演示资料无法确认这个问题。'\n\
          \            '请联系演示商城“帮助→人工客服”（虚构入口，无真实转接能力）。尚未实际转接。')\n\n\ndef supports(policy_id: str, body: str) ->\
          \ bool:\n    rules = {\n        'POL-01': r'本政策只适用于|二手、赠品和第三方平台商品不在本演示政策范围|不能批准退款',\n        'POL-02':\
          \ r'第1至第7个自然日|申请无理由退货',\n        'POL-03': r'第1至第15个自然日|可申请换货',\n        'POL-04': r'签收日起12个月|人为损坏|进液|维修方案和时间.{0,8}检测后确认|时间均需检测后确认',\n\
          \        'POL-05': r'标准寄回运费由企业承担|无理由退货的寄回运费由用户承担',\n        'POL-06': r'1至3个工作日|1至5个工作日|分别计时',\n     \
          \   'POL-07': r'2个工作日内发货|3至5个自然日送达|不承诺具体到货日',\n        'POL-08': r'只读|身份验证|个人信息',\n        'POL-09': r'未规定开票时效|专票资格|人工核验',\n\
          \        'POL-10': r'无法从知识库确认|没有真实工单|不得声称已转接|说明原因并建议联系人工',\n    }\n    pattern = rules.get(policy_id)\n\
          \    return bool(pattern and re.search(pattern, body))\n\n\ndef explicit_return_deadline_answer(query:\
          \ str, bodies: dict, catalog: dict) -> str | None:\n    \"\"\"Deterministically handle explicit received/event\
          \ dates when POL-02 is retrieved.\"\"\"\n    key = next((k for k in catalog if isinstance(k, str) and\
          \ k.upper() == 'POL-02'), None)\n    body = bodies.get(key, '') if key else ''\n    if ('签收' not in query\
          \ or not re.search(r'退(?:货)?', query) or not key\n            or '签收日为第0天' not in body or '第1至第7个自然日'\
          \ not in body):\n        return None\n    pattern = re.compile(r'(?:(\\d{4})年)?(\\d{1,2})月(\\d{1,2})(?:日|号)')\n\
          \    matches = list(pattern.finditer(query))\n    if len(matches) < 2:\n        return None\n    first,\
          \ last = matches[0], matches[1]\n    start_year = int(first.group(1) or 2026)\n    end_year = int(last.group(1)\
          \ or start_year)\n    try:\n        start = date(start_year, int(first.group(2)), int(first.group(3)))\n\
          \        end = date(end_year, int(last.group(2)), int(last.group(3)))\n    except ValueError:\n      \
          \  return None\n    elapsed = (end - start).days\n    if elapsed < 1:\n        return None\n    item =\
          \ catalog[key]\n    if elapsed <= 7:\n        finding = (f'{last.group(2)}月{last.group(3)}日是签收后的第{elapsed}个自然日，仍在第1至第7个自然日申请期限内。'\n\
          \                   '您可以提交无理由退货申请；商品须配件、包装齐全且不影响再次销售，申请不等于批准，仍需人工核验。')\n        if '拆封' in query and '拆封本身不自动拒绝'\
          \ in body:\n            finding = finding.replace('您可以提交无理由退货申请；', '拆封本身不自动拒绝；您可以提交无理由退货申请；')\n    else:\n\
          \        finding = (f'{last.group(2)}月{last.group(3)}日是签收后的第{elapsed}个自然日，已超过POL-02规定的无理由退货申请期限。'\n  \
          \                 '如涉及质量问题，请联系人工核实适用的质量处理政策；本轮不代表个案已获批准。')\n    return ('【演示数据】按POL-02，签收日为第0天；' + finding\n\
          \            + '\\n\\n资料依据（本轮检索）：\\n[POL-02] ' + item['title'] + '（' + item['file'] + '）')\n\n\ndef main(draft:\
          \ str, source_catalog: str, source_context: str, query: str) -> dict:\n    try:\n        catalog, chunks\
          \ = json.loads(source_catalog), json.loads(source_context)\n    except (TypeError, ValueError):\n    \
          \    return {'answer': FALLBACK}\n    if not isinstance(catalog, dict) or not isinstance(chunks, list)\
          \ or not isinstance(query, str):\n        return {'answer': FALLBACK}\n    draft = draft if isinstance(draft,\
          \ str) else ''\n    known = {k.upper(): k for k in catalog if isinstance(k, str)}\n    draft = re.sub(r'(?i)(?<![A-Z0-9\\\
          [])POL-\\d{2}(?!\\d|\\])',\n                   lambda m: '[' + known[m.group().upper()] + ']' if m.group().upper()\
          \ in known else m.group(), draft)\n    bodies = {pid: '\\n'.join(c['content'] for c in chunks if isinstance(c,\
          \ dict)\n              and c.get('source_id') == pid and isinstance(c.get('content'), str)) for pid in\
          \ catalog}\n    required = []\n    if re.search(r'发货|物流|到货|送达', query): required.append('POL-07')\n  \
          \  if re.search(r'质量|换货|保修|维修', query): required.append('POL-03' if re.search(r'质量|换货', query) else 'POL-04')\n\
          \    if re.search(r'运费|寄回|邮费', query): required.append('POL-05')\n    if re.search(r'无理由|拆封|退货流程|怎么退货|如何退货|期限|签收.{0,8}(?:天|日)|(?:是否|可不可以|能不能|可以|能|可).{0,6}退(?:货)?',\
          \ query): required.append('POL-02')\n    if re.search(r'发票|开票|税号|专票', query): required.extend(['POL-09',\
          \ 'POL-10'])\n    if re.search(r'(?:退款|退回).{0,16}(?:发起|到账|完成|进度|时间|银行)|(?:发起|到账|银行).{0,16}(?:退款|退回)',\
          \ query):\n        required.append('POL-06')\n    if re.search(r'未知.{0,8}(?:型号|产品|商品)|(?:型号|产品|商品).{0,8}(?:未知|未覆盖|范围外)',\
          \ query) and re.search(r'维修|保证|承诺|几天|天内|时效', query):\n        required.extend(['POL-01', 'POL-04', 'POL-10'])\n\
          \    required = list(dict.fromkeys(required))\n    missing = [p for p in required if not supports(p, bodies.get(p,\
          \ ''))]\n    invoice_question = bool(re.search(r'发票|开票|税号|专票', query))\n    policy_keys = {k.upper():\
          \ k for k in catalog if isinstance(k, str)}\n    pol09_key, pol10_key = policy_keys.get('POL-09'), policy_keys.get('POL-10')\n\
          \    pol09_body = bodies.get(pol09_key, '') if pol09_key else ''\n    pol10_body = bodies.get(pol10_key,\
          \ '') if pol10_key else ''\n    invoice_evidence_complete = (\n        pol09_key and pol10_key\n     \
          \   and all(re.search(p, pol09_body) for p in (\n            r'电子普通发票', r'未规定开票时效', r'专票资格', r'人工核验'))\n\
          \        and all(re.search(p, pol10_body) for p in (\n            r'没有真实工单系统', r'不得声称已转接')))\n    if invoice_question\
          \ and invoice_evidence_complete and not missing:\n        refs = [pol09_key, pol10_key]\n        footer\
          \ = '\\n'.join('[' + r + '] ' + catalog[r]['title'] + '（' + catalog[r]['file'] + '）' for r in refs)\n\
          \        return {'answer': ('【演示数据】当前演示政策仅说明可提供电子普通发票，资格需人工核验；知识库未规定专票资格或开票时效，因此无法确认，也不承诺具体开票时间。请自行联系人工核验；当前没有真实工单或自动转接能力，尚未实际转接。发票抬头与税号请勿发在本演示聊天中。'\n\
          \                          + '\\n\\n资料依据（本轮检索）：\\n' + footer)}\n    deadline_answer = explicit_return_deadline_answer(query,\
          \ bodies, catalog)\n    if deadline_answer:\n        return {'answer': deadline_answer}\n    refusal =\
          \ re.search(r'无法确认|无法确定|资料不足|没有相关|未能确认|未覆盖|不清楚|不确定', draft)\n    # A POL-04 example may mention inspection\
          \ or liquid damage without carrying the\n    # actual repair-time rule. Require the full rule sentence\
          \ for unknown-model timing.\n    unknown_repair = all(p in required for p in ('POL-01', 'POL-04', 'POL-10'))\n\
          \    if unknown_repair and not re.search(r'维修方案和时间均需检测后确认', bodies.get('POL-04', '')):\n        if 'POL-04'\
          \ not in missing:\n            missing.append('POL-04')\n    refs = list(dict.fromkeys(re.findall(r'\\\
          [(POL-\\d{2})\\]', draft)))\n    tokens = re.findall(r'(?i)(?<![A-Z0-9])POL[-_ ]?\\d+(?![0-9])', draft)\n\
          \    valid_citations = (bool(refs) and all(t.upper() in known for t in tokens)\n                     \
          \  and all(r in catalog and supports(r, bodies.get(r, '')) for r in refs))\n    # Do not let the model\
          \ calculate an individual calendar deadline absent in the query/evidence.\n    visible_dates = re.findall(r'\\\
          d{1,2}月\\d{1,2}(?:日|号)?', draft)\n    date_source = query + ' ' + source_context\n    if any(date not\
          \ in date_source for date in visible_dates):\n        valid_citations = False\n\n    # Answer refund-stage\
          \ questions directly only when the retrieved POL-06 chunk\n    # contains every required timing and status\
          \ rule.\n    refund_stage = bool(re.search(r'(?:退款|退回).{0,20}(?:发起|到账|完成|银行)|(?:发起|到账|银行).{0,20}(?:退款|退回)',\
          \ query))\n    pol06_key = next((k for k in catalog if isinstance(k, str) and k.upper() == 'POL-06'),\
          \ None)\n    pol06_body = bodies.get(pol06_key, '') if pol06_key else ''\n    refund_evidence_complete\
          \ = all(re.search(p, pol06_body) for p in (\n        r'1至3个工作日发起', r'1至5个工作日到账', r'分别计时',\n        r'不保证具体到账日',\
          \ r'退款中表示流程尚未完成', r'不等于资金已到账',\n        r'已退款表示模拟商家侧处理完成'))\n    if refund_stage and refund_evidence_complete\
          \ and pol06_key in required and not missing:\n        item = catalog[pol06_key]\n        return {'answer':\
          \ ('【演示数据】不算资金已到账，也不能仅凭“已发起”确认款项到账。POL-06规定：检验通过后1至3个工作日发起原支付渠道退款；发起后通常1至5个工作日到账，这两个阶段分别计时，不保证具体到账日。“退款中”表示流程尚未完成、不等于资金已到账；“已退款”仅表示模拟商家侧处理完成，支付渠道到账仍需核实。\\\
          n\\n资料依据（本轮检索）：\\n[' + pol06_key + '] ' + item['title'] + '（' + item['file'] + '）')}\n\n    # For unknown-product\
          \ repair-time questions, answer from the complete three-policy evidence set.\n    if unknown_repair and\
          \ not missing:\n        footer = '\\n'.join('[' + r + '] ' + catalog[r]['title'] + '（' + catalog[r]['file']\
          \ + '）' for r in required)\n        return {'answer': ('【演示数据】现有演示政策无法确认未知型号是否能在两天内维修。POL-04规定维修方案和时间需经检测确认，不能仅凭描述承诺；'\n\
          \                           '未知型号是否属于演示服务范围需由人工核实。当前没有真实工单或自动转接能力，'\n                           '请自行联系演示商城“帮助→人工客服”核实。\\\
          n\\n资料依据（本轮检索）：\\n' + footer)}\n\n    # A fluent answer is released only when every required policy rule\
          \ is present and cited.\n    if required and not missing and not refusal and valid_citations and all(p\
          \ in refs for p in required):\n        footer = '\\n'.join('[' + r + '] ' + catalog[r]['title'] + '（'\
          \ + catalog[r]['file'] + '）' for r in refs)\n        text = draft.strip()\n        if not text.startswith('【演示数据】'):\n\
          \            text = '【演示数据】\\n' + text\n        return {'answer': text + '\\n\\n资料依据（本轮检索）：\\n' + footer}\n\
          \n    # Incomplete retrieval stays conservative; display only captured source text and identify missing\
          \ support.\n    if required:\n        available = [p for p in required if bodies.get(p)]\n        if available:\n\
          \            parts, source_refs = [], []\n            for pid in available:\n                item = catalog.get(pid)\n\
          \                if not isinstance(item, dict) or not isinstance(item.get('title'), str) or not isinstance(item.get('file'),\
          \ str):\n                    return {'answer': FALLBACK}\n                parts.append('[' + pid + ']\
          \ ' + bodies[pid])\n                source_refs.append('[' + pid + '] ' + item['title'] + '（' + item['file']\
          \ + '）')\n            caveat = ('\\n\\n本轮未检索到回答全部问题所需的政策原文，请联系人工核实；以上摘录不代表个案已获批准。'\n                 \
          \     if missing else '\\n\\n以上原文仅供参考，不代表个案已获批准。')\n            return {'answer': '【演示数据】本轮检索到以下政策原文：\\\
          n' + '\\n\\n'.join(parts) + caveat\n                    + '\\n\\n资料依据（本轮检索）：\\n' + '\\n'.join(source_refs)}\n\
          \        return {'answer': FALLBACK}\n\n    if not draft.strip() or refusal:\n        return {'answer':\
          \ FALLBACK}\n    if not valid_citations:\n        return {'answer': FALLBACK}\n    if re.search(r'发票|专票|开票|税号',\
          \ query) and ('POL-09' not in refs or not supports('POL-09', bodies.get('POL-09', ''))):\n        return\
          \ {'answer': FALLBACK}\n    footer = '\\n'.join('[' + r + '] ' + catalog[r]['title'] + '（' + catalog[r]['file']\
          \ + '）' for r in refs)\n    text = draft.strip()\n    if not text.startswith('【演示数据】'):\n        text\
          \ = '【演示数据】\\n' + text\n    return {'answer': text + '\\n\\n资料依据（本轮检索）：\\n' + footer}\n"
