    - data:
        title: 标注检索来源
        type: code
        selected: false
        code_language: python3
        code: "\"\"\"Dify Code node: label retrieved chunks using known demo filenames only.\"\"\"\nimport json\n\
          import re\n\nPOLICIES = {\n    'POL-01': '服务范围', 'POL-02': '无理由退货', 'POL-03': '质量换货',\n    'POL-04': '保修范围',\
          \ 'POL-05': '退换货运费', 'POL-06': '退款进度',\n    'POL-07': '发货与物流', 'POL-08': '订单查询与权限', 'POL-09': '发票服务',\n\
          \    'POL-10': '人工协助与未知问题',\n}\n\ndef main(chunks: list) -> dict:\n    labelled = []\n    catalog = {}\n\
          \    if not isinstance(chunks, list):\n        chunks = []\n    for chunk in chunks:\n        if not isinstance(chunk,\
          \ dict):\n            continue\n        content = chunk.get('content')\n        if not isinstance(content,\
          \ str) or not content.strip():\n            continue\n        metadata = chunk.get('metadata')\n     \
          \   metadata = metadata if isinstance(metadata, dict) else {}\n        # Never infer the source from POL\
          \ numbers mentioned inside body text.\n        candidates = [metadata.get('document_name'), chunk.get('title')]\n\
          \        filenames = [s.strip() for s in candidates if isinstance(s, str) and s.strip()]\n        matched\
          \ = []\n        for filename in filenames:\n            match = re.fullmatch(r'(POL-\\d{2})\\.md', filename,\
          \ re.I)\n            if match and match.group(1).upper() in POLICIES:\n                matched.append(match.group(1).upper())\n\
          \        if not matched or len(set(matched)) != 1:\n            continue\n        pid = matched[0]\n \
          \       catalog[pid] = {'title': POLICIES[pid], 'file': pid + '.md'}\n        labelled.append({'source_id':\
          \ pid, 'title': POLICIES[pid],\n                         'file': pid + '.md', 'is_demo': True, 'content':\
          \ content.strip()})\n    return {\n        'source_context': json.dumps(labelled, ensure_ascii=False)\
          \ if labelled else '',\n        'source_catalog': json.dumps(catalog, ensure_ascii=False),\n    }\n"
        variables:
        - variable: chunks
          value_selector:
          - '1794315148814'
          - result
        outputs:
          source_context:
            type: string
            children: null
          source_catalog:
            type: string
            children: null
      height: 80
      id: demo_source_formatter
      position: &id007
        x: 660
        y: 120
      positionAbsolute: *id007
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
