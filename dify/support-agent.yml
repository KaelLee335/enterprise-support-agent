          \ \"refund_started_date\": null, \"refund_completed_date\": null}]')\n\ndef main(query: str) -> dict:\n\
          \    prefix = \"【演示数据】\"\n    if not isinstance(query, str) or not query.strip():\n        return {\"\
          route\": \"direct\", \"answer\": prefix + \"请描述一个售后问题。请勿提供真实客户信息。\"}\n    q = query.strip()\n    if re.search(r\"\
          \\b\\d{17}[\\dXx]\\b|1[3-9]\\d{9}\", q):\n        return {\"route\": \"direct\", \"answer\": prefix +\
          \ \"请勿发送身份证号或手机号。演示查询仅使用 DEMO 开头的虚构订单号。\"}\n    if re.search(r\"收件电话|收货电话|手机号|手机号码|联系电话|收件人|收货人|收件地址|收货地址|身份证|邮箱|个人信息|不用验证|无需验证|不验证身份\"\
          , q):\n        return {\"route\": \"direct\", \"answer\": prefix + \"无法在此核验订单归属或提供个人信息。请通过官方渠道完成身份验证后咨询人工客服；尚未实际转接。\"\
          }\n    # A purported authorization never enables a write action.\n    write = re.search(r\"退款|退钱|取消订单|改地址|修改地址|改价|删除订单|执行操作\"\
          , q)\n    imperative = re.search(r\"帮我|替我|给我|现在|立即|直接|执行|操作|授权|有权限|权限|有权|马上|办理\", q)\n    policy_question\
          \ = re.search(r\"政策|规则|流程|怎么申请|如何申请|条件|运费|几天|多久|能否|状态|进度|到哪一步|什么时候|可以.*(?:退|换|保修)\", q)\n    if write\
          \ and imperative and not policy_question:\n        return {\"route\": \"direct\", \"answer\": prefix +\
          \ \"我不能执行退款、取消或修改订单等操作，也不会改变订单。可以解释申请流程；尚未实际转接。\"}\n    topic_patterns = [r\"退货|无理由|七天\", r\"退款|退钱|到账\"\
          , r\"物流|发货|运费|地址\", r\"质量|换货|保修|维修\", r\"发票|开票|税号\"]\n    if sum(bool(re.search(pattern, q)) for pattern\
          \ in topic_patterns) >= 3:\n        return {\"route\": \"direct\", \"answer\": prefix + \"你提到了多个售后主题，请先选择一个（退换/退款、物流/运费、质量/保修或发票），我会逐项协助。\"\
          }\n    ids = list(dict.fromkeys(re.findall(r\"(?<![A-Z0-9])DEMO202611[0-9]{4}(?![A-Z0-9])\", q.upper())))\n\
          \    if len(ids) > 1:\n        return {\"route\": \"direct\", \"answer\": prefix + \"一次只能查询一个演示订单号，请提供其中一个。\"\
          }\n    if len(ids) == 1:\n        if policy_question and not re.search(r\"查(?:询)?|查看|状态|进度|到哪一步|什么时候|物流\"\
